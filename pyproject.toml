[project]
name = "voice-realtime"
version = "0.1.0"
description = "Duplex realtime voice skill for Claude Code / OpenCode. Multi-provider (OpenAI Realtime-2 + Gemini Live). Budget-capped."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.5.0",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
voice-realtime = "voice_realtime.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_realtime"]
