[project]
name = "voice-realtime"
version = "0.1.0"
description = "Duplex realtime voice skill for Claude Code / OpenCode. Multi-provider (OpenAI Realtime-2 + Gemini Live). Budget-capped."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.5.0",
    "numpy>=2.4.6",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sounddevice>=0.5.5",
    "typer>=0.25.1",
]

[project.scripts]
voice-realtime = "voice_realtime.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_realtime"]
